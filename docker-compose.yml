services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: runbook_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runbook_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/ai:/app
    ports:
      - "8001:8001"

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/runner:/app
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    # If Vite file watching is flaky in your environment, uncomment:
    # environment:
    #   CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres_data:
