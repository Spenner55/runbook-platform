services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runbook_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runbook_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-runbook_platform}
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-runbook_platform}
      PGBOUNCER_PORT: 5432
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
      PGBOUNCER_STATS_USERS: ${POSTGRES_USER:-postgres}
      PGBOUNCER_SET_DATABASE_USER: "yes"
      PGBOUNCER_SET_DATABASE_PASSWORD: "yes"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRESQL_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U \"$${POSTGRESQL_USERNAME}\" -d pgbouncer -c \"SHOW VERSION;\" >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-WARNING}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pgbouncer:5432/runbook_platform}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8001}
      AI_PARSE_MODEL: ${AI_PARSE_MODEL:-}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-1.0}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-60.0}
      AI_WRITE_TIMEOUT_SECONDS: ${AI_WRITE_TIMEOUT_SECONDS:-5.0}
      AI_POOL_TIMEOUT_SECONDS: ${AI_POOL_TIMEOUT_SECONDS:-1.0}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-100000}
      INTEGRATION_FERNET_KEY: ${INTEGRATION_FERNET_KEY:-}
      INTEGRATION_DISPATCH_TIMEOUT_SECONDS: ${INTEGRATION_DISPATCH_TIMEOUT_SECONDS:-3.0}
      INTEGRATION_DISPATCH_BUDGET_SECONDS: ${INTEGRATION_DISPATCH_BUDGET_SECONDS:-10.0}
      INTEGRATION_MAX_PER_TRIGGER: ${INTEGRATION_MAX_PER_TRIGGER:-25}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      ARTIFACT_MEDIA_ROOT: ${ARTIFACT_MEDIA_ROOT:-/app/media/artifacts}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-artifacts/}
      ARTIFACT_ALLOWED_MIME_TYPES: ${ARTIFACT_ALLOWED_MIME_TYPES:-}
      ARTIFACT_REQUIRE_CHECKSUM: ${ARTIFACT_REQUIRE_CHECKSUM:-1}
      ARTIFACT_MAX_UPLOAD_BYTES: ${ARTIFACT_MAX_UPLOAD_BYTES:-52428800}
      ARTIFACT_MAX_ARTIFACTS_PER_STEP: ${ARTIFACT_MAX_ARTIFACTS_PER_STEP:-10}
      ARTIFACT_MAX_TOTAL_BYTES_PER_EXECUTION: ${ARTIFACT_MAX_TOTAL_BYTES_PER_EXECUTION:-262144000}
      ARTIFACT_DAILY_BYTES_PER_RUNNER: ${ARTIFACT_DAILY_BYTES_PER_RUNNER:-1073741824}
      ARTIFACT_DOWNLOAD_URL_TTL_SECONDS: ${ARTIFACT_DOWNLOAD_URL_TTL_SECONDS:-300}
      ARTIFACT_MAX_METADATA_BYTES: ${ARTIFACT_MAX_METADATA_BYTES:-8192}
      ARTIFACT_STDOUT_STDERR_MAX_BYTES: ${ARTIFACT_STDOUT_STDERR_MAX_BYTES:-5242880}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:?RUNNER_REGISTRATION_TOKEN is required}
    volumes:
      - ./apps/api:/app
      - ./packages/workflow-schema:/packages/workflow-schema:ro
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import httpx; r = httpx.get('http://localhost:8000/health/ready/', timeout=5); raise SystemExit(0 if r.status_code == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/ai:/app
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import httpx; r = httpx.get('http://localhost:8001/health', timeout=5); raise SystemExit(0 if r.status_code == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      RUNNER_ID: ${RUNNER_ID:-runner-dev}
      RUNNER_VERSION: ${RUNNER_VERSION:-0.1.0}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:?RUNNER_REGISTRATION_TOKEN is required}
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-5}
      RUNNER_HEARTBEAT_INTERVAL_SECONDS: ${RUNNER_HEARTBEAT_INTERVAL_SECONDS:-10}
      RUNNER_FAKE_STEP_DELAY_SECONDS: ${RUNNER_FAKE_STEP_DELAY_SECONDS:-1.0}
      RUNNER_LOG_LEVEL: ${RUNNER_LOG_LEVEL:-INFO}
    volumes:
      - ./apps/runner:/app
    depends_on:
      api:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    # If Vite file watching is flaky in your environment, uncomment:
    # environment:
    #   CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres_data:
